name: Publish static demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract downloadable web package
        run: |
          mkdir -p site extracted
          unzip -q "工银智汇通系统Demo-可下载版-v2.zip" -d extracted
          PACKAGE_ROOT="$(dirname "$(find extracted -type f -name index.html -print -quit)")"
          cp -R "$PACKAGE_ROOT/." site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
